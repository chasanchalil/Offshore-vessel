name: Collect AIS positions

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install --quiet websockets

      - name: Collect positions from AISStream
        env:
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
          LISTEN_SECONDS: "240"
        run: python collect.py

      - name: Save data to repository
        run: |
          git config user.name "ais-bot"
          git config user.email "ais-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "AIS update $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push

      - name: Publish dashboard
        uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
