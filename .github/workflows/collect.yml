name: Collect AIS positions

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install --quiet websockets

      - name: Collect positions (55 min, saved every 15 min)
        env:
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
          RUN_MINUTES: "55"
        run: |
          git config user.name "ais-bot"
          git config user.email "ais-bot@users.noreply.github.com"
          python collect.py
