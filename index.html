<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vessel Tracker</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="analysis.js"></script>
<style>
:root{--bg:#0f1720;--panel:#16212d;--line:#24364a;--txt:#e6edf3;--mut:#8aa0b4;--acc:#2f9be0;--ok:#2fbf71;--warn:#e0a92f;--bad:#e0563f}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
header h1{font-size:16px;margin:0;font-weight:600}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;background:#0b121a;border:1px solid var(--line);font-size:12px;color:var(--mut)}
.sp{flex:1}
button,select{font:inherit;color:var(--txt);background:#0b121a;border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer}
button:hover{border-color:var(--acc)}
button.on{background:var(--acc);border-color:var(--acc);color:#fff}
body{display:flex;flex-direction:column}
main{display:flex;flex:1;min-height:0}
aside{width:390px;min-width:300px;border-right:1px solid var(--line);display:flex;flex-direction:column;background:var(--panel)}
#map{flex:1}
#list{overflow:auto;flex:1}
.v{padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.v:hover,.v.sel{background:#1c2a39}
.v .t{display:flex;align-items:center;gap:8px;font-weight:600}
.v .t .age{margin-left:auto;font-weight:400;font-size:12px}
.v .m{color:var(--mut);font-size:12px;margin-top:3px;display:grid;grid-template-columns:1fr 1fr;gap:2px 10px}
.job{font-size:11px;color:var(--acc);font-weight:400}
.g{color:var(--ok)}.a{color:var(--warn)}.r{color:var(--bad)}.n{color:var(--mut)}
#act{display:none;border-top:1px solid var(--line);max-height:48%;overflow:auto;padding:8px 12px}
.bar{display:flex;height:14px;border-radius:4px;overflow:hidden;margin:6px 0 8px;background:#0b121a}
.bar span{display:block;height:100%}
table.at{width:100%;border-collapse:collapse;font-size:12px}
table.at td,table.at th{padding:4px 6px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
table.at th{color:var(--mut);font-weight:500}
table.at td.num,table.at th.num{text-align:right}
.sw{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}
.foot{padding:8px 12px;border-top:1px solid var(--line);font-size:12px;color:var(--mut);display:flex;gap:8px;flex-wrap:wrap}
#fleet,#vuo,#sites,#disc,#jobs{display:none;flex:1;overflow:auto;padding:16px}
.pane h2,.pane h3{font-size:15px;margin:0 0 4px}.pane p{color:var(--mut);font-size:12px;margin:0 0 12px}
tr[data-u],tr[data-s],tr[data-d]{cursor:pointer}tr[data-u]:hover td,tr[data-s]:hover td,tr[data-d]:hover td{background:#1c2a39}
.tag{display:inline-block;padding:1px 6px;border-radius:4px;background:#0b121a;border:1px solid var(--line);font-size:11px}
#fleet h2{font-size:15px;margin:0 0 4px}
#fleet p{color:var(--mut);font-size:12px;margin:0 0 12px}
#fleet tr{cursor:pointer}#fleet tr:hover td{background:#1c2a39}
.ship-ico{background:none;border:none}
.leaflet-popup-content{font-size:13px;line-height:1.5}
.gantt{position:relative;margin-top:10px}
.grow{display:flex;align-items:center;border-bottom:1px solid var(--line);height:26px}
.glab{width:150px;flex:none;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:6px}
.gbar{position:relative;flex:1;height:16px;background:#0b121a;border-radius:3px}
.gbar span{position:absolute;top:0;height:100%}
.gaxis{display:flex;margin-left:150px;font-size:10px;color:var(--mut);position:relative;height:16px}
.gaxis span{position:absolute;transform:translateX(-50%)}
.rp{display:flex;gap:8px;align-items:center;margin:6px 0}.rp input{flex:1}
.prog{height:8px;background:#0b121a;border-radius:4px;overflow:hidden;width:80px;display:inline-block;vertical-align:middle}.prog i{display:block;height:100%;background:var(--ok)}
@media (max-width:760px){main{flex-direction:column}aside{width:100%;height:50%;border-right:none;border-bottom:1px solid var(--line)}}
</style>
</head>
<body>
<header>
  <h1>⚓ Vessel Tracker</h1>
  <span class="pill" id="upd">Loading…</span>
  <span class="sp"></span>
  <select id="ctr"><option value="">All contractors</option></select>
  <button id="tMap" class="on">Map</button><button id="tFleet">Fleet</button><button id="tJobs">Analysis</button><button id="tVuo">VUO</button><button id="tSites">Sites</button><button id="tDisc">Discovery</button>
  <select id="hours">
    <option value="24">Last 24 h</option><option value="72">Last 3 d</option>
    <option value="168" selected>Last 7 d</option><option value="720">Last 30 d</option>
  </select>
  <button id="acsv">Activity CSV</button><button id="jcsv">Jobs CSV</button>
</header>
<main>
  <aside id="side">
    <div id="list"></div>
    <div id="act"></div>
    <div class="foot"><span class="g">● &lt;45 min</span><span class="a">● &lt;3 h</span><span class="r">● older</span><span class="n">● no data</span>
      <span class="sp"></span><span>AIS: AISStream.io + BarentsWatch (NLOD) · Weather: <a href="https://open-meteo.com" style="color:var(--mut)">Open-Meteo.com</a> · Wind farms: EMODnet (CC BY 4.0) · v3.5</span></div>
  </aside>
  <div id="map"></div>
  <div id="fleet" class="pane"></div>
  <div id="jobs" class="pane"></div>
  <div id="vuo" class="pane"></div>
  <div id="sites" class="pane"></div>
  <div id="disc" class="pane"></div>
</main>
<script>
const NAV=["Under way (engine)","At anchor","Not under command","Restricted manoeuvrability","Constrained by draught","Moored","Aground","Fishing","Under way (sailing)","","","Towing astern","Pushing ahead","","AIS-SART","Not defined"];
const $=id=>document.getElementById(id);
let vessels=[], latest={}, disc={vessels:{}}, selected=null, firstFit=true, mode="map", vuoSel=null, siteSel=null;
const markers={}; let trackLayer=null;

const map=L.map("map",{worldCopyJump:true}).setView([54.5,6],6);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:18,attribution:"© OpenStreetMap"}).addTo(map);
const sea=L.tileLayer("https://tiles.openseamap.org/seamark/{z}/{x}/{y}.png",{maxZoom:18,attribution:"© OpenSeaMap"}).addTo(map);
const WFCOL={production:"#2fbf71",construction:"#e0a92f",approved:"#2f9be0",planned:"#8aa0b4","test site":"#9b7be0",dismantled:"#555"};
const wfLayer=L.geoJSON(null,{style:f=>{const st=wfStatus(f.properties); return {color:WFCOL[st]||"#8aa0b4",weight:1.2,fillOpacity:st==="planned"?0.04:0.12,dashArray:st==="planned"?"4 4":null};},
  onEachFeature:(f,l)=>{const p=f.properties,n=wfName(p),tb=wfTurbines(p); l.bindTooltip(esc(n),{sticky:true});
    l.bindPopup(`<b>${esc(n)}</b><br>${esc(wfStatus(p))}${pick(p,["country","COUNTRY"])?" · "+esc(pick(p,["country","COUNTRY"])):""}${pick(p,["power_mw","POWER_MW","power"])?" · "+esc(pick(p,["power_mw","POWER_MW","power"]))+" MW":""}${tb?" · "+tb+" turbines":""}`);}}).addTo(map);
const discLayer=L.layerGroup();
L.control.layers(null,{"Wind farms":wfLayer,"Discovered vessels":discLayer,"Sea marks":sea}).addTo(map); L.control.scale({imperial:false}).addTo(map);

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=(x,d=1)=>x==null||x===""||isNaN(x)?"–":Number(x).toFixed(d);
const local=ts=>ts?new Date(ts).toLocaleString([], {dateStyle:"short",timeStyle:"short"}):"–";
const ageMin=ts=>ts?(Date.now()-Date.parse(ts))/60000:null;
const ageCls=m=>m==null?"n":m<45?"g":m<180?"a":"r";
const ageTxt=m=>m==null?"no data":m<60?Math.round(m)+" min":m<2880?(m/60).toFixed(1)+" h":Math.round(m/1440)+" d";
const per=()=>$("hours").selectedOptions[0].text.toLowerCase();
const H=()=>+$("hours").value;

// Data is read straight from the repository (updated every 15 min); falls back to the published copy
const RAW=(()=>{ const h=location.hostname, seg=location.pathname.split("/").filter(Boolean)[0];
  return h.endsWith(".github.io")&&seg?`https://raw.githubusercontent.com/${h.split(".")[0]}/${seg}/main/`:""; })();
async function getText(url){
  if(RAW&&(url.startsWith("data/")||url==="limits.json")){ try{ const r=await fetch(RAW+url+"?t="+Date.now()); if(r.ok) return r.text(); }catch(e){} }
  const r=await fetch(url+"?t="+Date.now()); if(!r.ok) throw new Error(r.status); return r.text(); }

async function load(){
  vessels=JSON.parse(await getText("vessels.json"));
  const cur=$("ctr").value, cs=[...new Set(vessels.map(v=>v.contractor).filter(Boolean))];
  $("ctr").innerHTML='<option value="">All contractors</option>'+cs.map(c=>`<option ${c===cur?"selected":""}>${esc(c)}</option>`).join("");
  try{ latest=JSON.parse(await getText("data/latest.json")); }catch(e){ latest={vessels:{}}; }
  try{ LIMIT_OVERRIDE=JSON.parse(await getText("limits.json")); }catch(e){ LIMIT_OVERRIDE={}; }
  let d1={vessels:{}}, d2={vessels:{}};
  try{ d1=JSON.parse(await getText("data/discovery.json")); }catch(e){}
  try{ d2=JSON.parse(await getText("data/dma_discovery.json")); }catch(e){}
  disc=mergeDiscovery(d1,d2);
  const now=new Date(), months=[];
  for(let i=1;i>=0;i--){ const d=new Date(Date.UTC(now.getUTCFullYear(),now.getUTCMonth()-i,1)); months.push(d.toISOString().slice(0,7)); }
  resetData();
  for(const m of months){
    try{ loadPositions(parseCSV(await getText(`data/positions_${m}.csv`))); }catch(e){}
    try{ loadWeather(parseCSV(await getText(`data/weather_${m}.csv`))); }catch(e){}
    try{ loadPositions(parseCSV(await getText(`data/dma_positions_${m}.csv`))); }catch(e){}
  }
  sortAll();
  if(!wfIndex.length){ try{ const gj=JSON.parse(await getText("data/windfarms.geojson")); wfLayer.clearLayers(); wfLayer.addData(gj); buildWfIndex(gj); }catch(e){} }
  const lr=latest.last_run;
  $("upd").textContent = lr ? `Updated ${local(lr.utc)} · ${lr.received}/${lr.tracked} this slot · ${lr.ever_seen??"?"}/${lr.tracked} seen` : "No data yet – run the workflow once";
  render();
}

function info(v){ return Object.assign({mmsi:v.mmsi,label:v.name||v.mmsi,job:v.job||"",contractor:v.contractor||"",vtype:v.type||""}, latest.vessels?.[v.mmsi]||{}); }
const shown=()=>vessels.filter(v=>!$("ctr").value||v.contractor===$("ctr").value);

function icon(v){
  const col={g:"#2fbf71",a:"#e0a92f",r:"#e0563f",n:"#8aa0b4"}[ageCls(ageMin(v.ts_utc))];
  const sel=v.mmsi===selected?'stroke="#fff" stroke-width="2.5"':'stroke="#0b121a" stroke-width="1.5"';
  const mov=(v.sog??0)>0.5, rot=v.heading??v.cog??0;
  const shape=mov?'<path d="M12 2 L19 21 L12 17 L5 21 Z"/>':'<circle cx="12" cy="12" r="6"/>';
  return L.divIcon({className:"ship-ico",iconSize:[24,24],iconAnchor:[12,12],
    html:`<svg width="24" height="24" viewBox="0 0 24 24" style="transform:rotate(${mov?rot:0}deg)"><g fill="${col}" ${sel}>${shape}</g></svg>`});
}
function where(v){ if(v.lat==null) return ""; const wf=windfarmAt(v.lat,v.lon); if(wf) return "📍 "+wf; const pt=portAt(v.lat,v.lon); return pt?"⚓ "+pt:""; }
function popup(v){
  const nav=v.nav_status!=null&&NAV[v.nav_status]?NAV[v.nav_status]:"–";
  return `<b>${esc(v.label)}</b> · ${esc(v.contractor)} ${esc(v.vtype)}${v.job?" · "+esc(v.job):""}<br>MMSI ${v.mmsi}${v.imo?" · IMO "+esc(v.imo):""}${v.length?` · ${v.length}×${v.beam??"?"} m`:""}<br>
  ${where(v)?esc(where(v))+"<br>":""}SOG ${fmt(v.sog)} kn · COG ${fmt(v.cog,0)}° · ${nav}<br>${v.destination?"→ "+esc(v.destination)+(v.eta?" (ETA "+esc(v.eta)+")":"")+"<br>":""}
  ${v.weather?`Hs ${fmt(v.weather.hs_m)} m · Tp ${fmt(v.weather.tp_s,0)} s · Wind ${fmt(v.weather.wind_ms)} m/s (gust ${fmt(v.weather.gust_ms)}) · ${local(v.weather.ts_utc)}<br>`:""}
  ${fmt(v.lat,4)}, ${fmt(v.lon,4)}<br>Last: ${local(v.ts_utc)} (${ageTxt(ageMin(v.ts_utc))} ago)`;
}

function render(){
  const list=shown().map(info);
  $("list").innerHTML=list.map(v=>{const m=ageMin(v.ts_utc);
    return `<div class="v ${v.mmsi===selected?"sel":""}" data-m="${v.mmsi}">
      <div class="t"><span class="${ageCls(m)}">●</span>${esc(v.label)} <span class="job">${esc(v.contractor)} · ${esc(v.vtype)}${v.job?" · "+esc(v.job):""}</span><span class="age ${ageCls(m)}">${ageTxt(m)}</span></div>
      <div class="m"><span>SOG ${fmt(v.sog)} kn · COG ${fmt(v.cog,0)}°</span><span>${v.lat!=null?classify(v.sog==null?null:+v.sog,v.nav_status):"–"}</span>
      ${where(v)?`<span style="grid-column:1/3">${esc(where(v))}</span>`:""}
      ${v.weather?`<span style="grid-column:1/3">🌊 Hs ${fmt(v.weather.hs_m)} m · Tp ${fmt(v.weather.tp_s,0)} s · 💨 ${fmt(v.weather.wind_ms)} m/s (gust ${fmt(v.weather.gust_ms)})</span>`:""}
      ${v.destination?`<span style="grid-column:1/3">→ ${esc(v.destination)}</span>`:""}</div></div>`;}).join("");
  const seen=new Set();
  for(const v of list){ if(v.lat==null) continue; seen.add(v.mmsi);
    if(!markers[v.mmsi]){ markers[v.mmsi]=L.marker([v.lat,v.lon]).addTo(map).on("click",()=>select(v.mmsi,false)).bindPopup("").bindTooltip("",{direction:"top",offset:[0,-10]}); }
    markers[v.mmsi].setLatLng([v.lat,v.lon]).setIcon(icon(v)).setPopupContent(popup(v)).setTooltipContent(esc(v.label)); }
  for(const k in markers) if(!seen.has(k)){ map.removeLayer(markers[k]); delete markers[k]; }
  if(firstFit&&seen.size){ firstFit=false; map.fitBounds(list.filter(v=>v.lat!=null).map(v=>[v.lat,v.lon]),{padding:[40,40],maxZoom:10}); }
  renderDiscLayer();
  if(mode==="map") renderAct(); if(mode==="fleet") renderFleet(); if(mode==="vuo") renderVuo();
  if(mode==="sites") renderSites(); if(mode==="disc") renderDisc(); if(mode==="jobs") renderJobs();
}

/* ---- vessel panel + track replay ---- */
let replay={timer:null,i:0,pts:[],mk:null};
function stopReplay(){ if(replay.timer){ clearInterval(replay.timer); replay.timer=null; } const b=$("rpPlay"); if(b) b.textContent="▶"; }
function showReplay(i){
  const p=replay.pts[i]; if(!p) return; replay.i=i;
  if(!replay.mk) replay.mk=L.circleMarker([p.lat,p.lon],{radius:8,color:"#fff",weight:2,fillColor:"#2f9be0",fillOpacity:1}).addTo(map);
  replay.mk.setLatLng([p.lat,p.lon]); if($("rpSlider")) $("rpSlider").value=i;
  const wf=windfarmAt(p.lat,p.lon), pt=wf?null:portAt(p.lat,p.lon);
  if($("rpLab")) $("rpLab").textContent=`${local(p.ts)} · ${fmt(p.sog)} kn · ${classify(p.sog,p.nav)}${wf?" · "+wf:pt?" · "+pt:""}`;
}
function renderAct(){
  stopReplay(); if(replay.mk){ map.removeLayer(replay.mk); replay.mk=null; }
  if(trackLayer){ map.removeLayer(trackLayer); trackLayer=null; }
  const box=$("act"); if(!selected){ box.style.display="none"; return; }
  const v=info(vessels.find(x=>x.mmsi===selected)), h=H(), a=activity(selected,h,v.vtype);
  const pts=(positions[selected]||[]).filter(p=>Date.parse(p.ts)>=Date.now()-h*3600e3);
  replay.pts=pts;
  if(pts.length>1) trackLayer=L.layerGroup([L.polyline(pts.map(p=>[p.lat,p.lon]),{color:"#2f9be0",weight:3,opacity:.85}),
    ...pts.map(p=>L.circleMarker([p.lat,p.lon],{radius:3,color:SCOL[classify(p.sog,p.nav)],fillOpacity:1,weight:1}).bindTooltip(`${local(p.ts)} · ${fmt(p.sog)} kn`))]).addTo(map);
  box.style.display="block";
  box.innerHTML=`<b>${esc(v.label)}</b> <span class="job">${esc(v.job)}</span> – ${per()}
   ${pts.length>1?`<div class="rp"><button id="rpPlay">▶</button><input type="range" id="rpSlider" min="0" max="${pts.length-1}" value="0"><select id="rpSpeed"><option value="300">1×</option><option value="120" selected>2×</option><option value="40">5×</option></select></div><div id="rpLab" style="font-size:12px;color:var(--mut)">Track replay – press ▶</div>`:""}
   <div class="bar">${a.segs.map(s=>`<span title="${s.state} ${s.hours.toFixed(1)} h" style="width:${100*s.hours/h}%;background:${SCOL[s.state]}"></span>`).join("")}</div>
   <table class="at"><tr><th>Activity</th><th class="num">Hours</th><th class="num">%</th></tr>
   ${STATES.filter(s=>a.totals[s]>0.01).map(s=>`<tr><td><span class="sw" style="background:${SCOL[s]}"></span>${s}</td><td class="num">${a.totals[s].toFixed(1)}</td><td class="num">${(100*a.totals[s]/h).toFixed(0)}%</td></tr>`).join("")}</table>
   ${(()=>{ const J=jobLog(selected,h,v.vtype); if(!J.visits.length) return "";
     return `<table class="at" style="margin-top:8px"><tr><th>Wind farm visit</th><th>Arrived</th><th class="num">h</th><th class="num">${J.clv?"km":"Positions"}</th><th class="num">Weather h</th></tr>${J.visits.slice().reverse().map(x=>`<tr><td>${esc(x.wf)}</td><td>${local(x.start)}</td><td class="num">${x.h.toFixed(1)}</td><td class="num">${J.clv?x.km.toFixed(1):x.jobs}</td><td class="num">${x.wowH.toFixed(1)}</td></tr>`).join("")}</table><p style="font-size:11px;color:var(--mut);margin:2px 0 6px">Full job log: VUO tab → click the vessel.</p>`; })()}
   <p style="font-size:11px;color:var(--mut);margin:4px 0">Weather limit for ${esc(v.vtype||"this vessel")}: Hs ${a.limits.hs} m · wind ${a.limits.wind} m/s</p>
   <table class="at" style="margin-top:8px"><tr><th>Start</th><th>Activity</th><th class="num">h</th><th>Where</th><th class="num">Hs avg/max m</th><th class="num">Wind avg m/s</th></tr>
   ${a.segs.slice().reverse().map(s=>`<tr><td>${local(s.start)}</td><td><span class="sw" style="background:${SCOL[s.state]}"></span>${s.state}</td><td class="num">${s.hours.toFixed(1)}</td><td>${esc(s.wf||s.port||(s.lat!=null?fmt(s.lat,2)+", "+fmt(s.lon,2):"–"))}</td><td class="num">${fmt(s.hs)} / ${fmt(s.hs_max)}</td><td class="num">${fmt(s.wind)}</td></tr>`).join("")}</table>`;
  if(pts.length>1){
    $("rpSlider").oninput=e=>{ stopReplay(); showReplay(+e.target.value); };
    $("rpPlay").onclick=()=>{ if(replay.timer){ stopReplay(); return; }
      if(replay.i>=pts.length-1) replay.i=0; $("rpPlay").textContent="❚❚";
      replay.timer=setInterval(()=>{ if(replay.i>=pts.length-1){ stopReplay(); return; } showReplay(replay.i+1); },+$("rpSpeed").value); };
  }
}

/* ---- Fleet ---- */
function wAvg(a,k){ let h=0,x=0; for(const s of a.segs) if(WORK_STATES.includes(s.state)&&s[k]!=null){ h+=s.hours; x+=s[k]*s.hours; } return h?fmt(x/h):"–"; }
function renderFleet(){
  const h=H(), rows=shown().map(v0=>{const v=info(v0); return {v,a:activity(v.mmsi,h,v.vtype)};});
  $("fleet").innerHTML=`<h2>Fleet activity – ${per()}</h2>
   <p>Hours per activity from 15-min AIS. Working = &lt; 1 kn and not moored/anchored. <b>Waiting on weather</b> = working/stationary offshore while Hs or wind is above the vessel-type limit. Click a row to open the vessel.</p>
   <table class="at"><tr><th>Vessel</th><th>Contractor</th><th>Type</th>${STATES.map(s=>`<th class="num"><span class="sw" style="background:${SCOL[s]}"></span>${s}</th>`).join("")}<th class="num">Working % of covered</th><th class="num">Hs working</th><th class="num">Wind working</th></tr>
   ${rows.map(({v,a})=>{const cov=h-a.totals["No data"], wk=WORK_STATES.reduce((s,k)=>s+a.totals[k],0); return `<tr data-f="${v.mmsi}" style="cursor:pointer"><td>${esc(v.label)}</td><td>${esc(v.contractor)}</td><td>${esc(v.vtype)}</td>
     ${STATES.map(s=>`<td class="num">${a.totals[s]?a.totals[s].toFixed(1):"–"}</td>`).join("")}
     <td class="num">${cov>0.5?(100*wk/cov).toFixed(0)+"%":"–"}</td><td class="num">${wAvg(a,"hs")}</td><td class="num">${wAvg(a,"wind")}</td></tr>`;}).join("")}</table>`;
}

/* ---- VUO ---- */

/* ---- Job log (visits -> positions / lay segments -> pauses) ---- */
const PCOL={"Weather":"#e0563f","Port":"#8aa0b4","Anchor":"#e0a92f","Transit":"#2f9be0","No AIS":"#3a4a5c"};

  let html=`<h3 id="jl" style="margin-top:18px">${esc(v.label)} – job log (${per()})</h3>

  if(!J.visits.length) return html+"<p>No jobs detected in this period yet.</p>";
  html+=`<table class="at"><tr><th>Wind farm</th><th>Arrived</th><th>Left</th><th class="num">On site h</th><th class="num">${clv?"Runs":"Positions"}</th><th class="num">Work h</th>${clv?'<th class="num">km</th><th class="num">km/day</th>':'<th class="num">h / position</th>'}${clv?"":'<th class="num">net h / position</th>'}<th class="num">Pauses h</th><th class="num">Weather h</th><th>From → to</th></tr>
   ${J.visits.map((x,i)=>`<tr data-vis="${i}" style="cursor:pointer"><td><b>${esc(x.wf)}</b></td><td>${local(x.start)}</td><td>${x.ongoing?"<i>ongoing</i>":local(x.end)}</td><td class="num">${x.h.toFixed(1)}</td><td class="num">${x.jobs}</td><td class="num">${x.workH.toFixed(1)}</td>

     ${clv?"":`<td class="num">${fmt(x.netJobH)}</td>`}<td class="num">${x.pauseH.toFixed(1)}</td><td class="num">${x.wowH.toFixed(1)}</td><td>${esc(x.arrivedFrom||"–")} → ${x.ongoing?"…":esc(x.leftTo||"–")}</td></tr>`).join("")}</table>`;

function itemsTable(x,clv){ let n=0;
  return `<table class="at" style="margin-top:6px"><tr><th>#</th><th>Activity</th><th>Start</th><th>End</th><th class="num">Hours</th>${clv?'<th class="num">km</th>':""}<th>Reason / note</th><th class="num">of which weather h</th><th class="num">Hs avg m</th><th>Position</th></tr>

/* ---- Analysis tab: one analysis per vessel ---- */
let jobOpen=new Set(), vesOpen=new Set(), jobKind="all", jobWf="", jobVes="";
function vesselAnalysis(v){
  const h=H(), J=jobLog(v.mmsi,h,v.vtype), a=activity(v.mmsi,h,v.vtype);
  const visits=J.visits.map((x,i)=>({x,key:v.mmsi+"|"+i})).filter(r=>!jobWf||r.x.wf===jobWf).sort((p,q)=>q.x.start-p.x.start);
  const sum=f=>visits.reduce((s,r)=>s+f(r.x),0);
  const jobs=sum(x=>x.jobs), workH=sum(x=>x.workH), net=sum(x=>x.netJobH!=null?x.netJobH*x.jobs:0), km=sum(x=>x.km), wow=sum(x=>x.wowH), site=sum(x=>x.h);
  const t=a.totals, cov=h-t["No data"], wk=WORK_STATES.reduce((s,k)=>s+t[k],0);
  return {v,clv:J.clv,a,visits,jobs,workH,net,km,wow,site,cov,wk,calls:J.calls};
}

function bindJobs(){
  if($("jVes")) $("jVes").onchange=e=>{ jobVes=e.target.value; renderJobs(); };
  if($("jAll")) $("jAll").onclick=()=>{ shown().forEach(v=>vesOpen.add(String(v.mmsi))); renderJobs(); };
  if($("jNone")) $("jNone").onclick=()=>{ vesOpen.clear(); jobOpen.clear(); renderJobs(); };
  document.querySelectorAll("#jobs details[data-vs]").forEach(d=>d.addEventListener("toggle",()=>{ const m=d.dataset.vs;
    if(d.open&&!vesOpen.has(m)){ vesOpen.add(m); renderJobs(); } else if(!d.open&&vesOpen.has(m)){ vesOpen.delete(m); } }));
  if($("jKind")) $("jKind").onchange=e=>{ jobKind=e.target.value; renderJobs(); };
  if($("jWf")) $("jWf").onchange=e=>{ jobWf=e.target.value; renderJobs(); };
}

/* ---- Discovery (untracked vessels seen inside wind farms) ---- */
const AISTYPE=(t,txt)=>{ t=+t; if(!t) return txt||"Unknown"; if(t===30) return "Fishing"; if(t===31||t===32) return "Towing"; if(t===33) return "Dredging / UW ops";
  if(t===50) return "Pilot"; if(t===51) return "SAR"; if(t===52) return "Tug"; if(t===55) return "Law enforcement"; if(t>=60&&t<70) return "Passenger";
  if(t>=70&&t<80) return "Cargo"; if(t>=80&&t<90) return "Tanker"; if(t>=90&&t<100) return "Other (SOV/CTV/special)"; return "Type "+t; };
function discList(){
  const tracked=new Set(vessels.map(v=>String(v.mmsi))), hideCargo=$("dHide")?$("dHide").checked:true;
  return Object.entries(disc.vessels||{}).map(([m,d])=>({mmsi:m,...d})).filter(d=>!tracked.has(d.mmsi))
    .filter(d=>!hideCargo||!((+d.ship_type>=70&&+d.ship_type<90)||/cargo|tanker/i.test(d.ship_type_txt||""))).filter(d=>(d.slots||0)>=2)
    .sort((a,b)=>(b.slots||0)-(a.slots||0));
}
function renderDiscLayer(){
  discLayer.clearLayers();
  for(const d of discList().slice(0,300)) if(d.lat!=null)
    L.circleMarker([d.lat,d.lon],{radius:4,color:"#c9a0ff",weight:1,fillOpacity:.8}).bindTooltip(`${esc(d.name||d.mmsi)} · ${AISTYPE(d.ship_type,d.ship_type_txt)} · ${(d.sites||[]).slice(0,2).join(", ")}`).addTo(discLayer);
}
function renderDisc(){
  const keep=$("dHide")?$("dHide").checked:true, L0=discList();
  let html=`<h2>Discovery – vessels working in wind farms that are not in your list</h2>
   <p>Collected from AIS over active wind farm areas. Hours = 15-min slots seen inside a wind farm polygon (last 30 days). Typical finds: SOVs, CTVs, feeder barges, guard and survey vessels.
   To track one, add <code>{"mmsi": "…", "name": "…", "contractor": "…", "type": "…"}</code> to vessels.json. ${disc.updated_utc?"Updated "+local(disc.updated_utc)+".":""}</p>
   <label style="font-size:12px"><input type="checkbox" id="dHide" ${keep?"checked":""}> Hide cargo ships and tankers</label>`;
  html+=L0.length?`<table class="at" style="margin-top:8px"><tr><th>Name</th><th>MMSI</th><th>AIS type</th><th class="num">Hours seen</th><th>Wind farm(s)</th><th>First seen</th><th>Last seen</th><th>Destination</th></tr>
   ${L0.slice(0,300).map(d=>`<tr data-d="${d.mmsi}"><td>${esc(d.name||"–")}</td><td>${d.mmsi}</td><td>${AISTYPE(d.ship_type,d.ship_type_txt)}</td><td class="num">${((d.slots||0)/4).toFixed(1)}</td><td>${esc((d.sites||[]).slice(0,3).join(", "))}</td><td>${local(d.first)}</td><td>${local(d.last)}</td><td>${esc(d.destination||"")}</td></tr>`).join("")}</table>`
   :"<p>No discovered vessels yet – the list fills up as the collector runs.</p>";
  $("disc").innerHTML=html;
  $("dHide").onchange=()=>{ renderDisc(); renderDiscLayer(); };
}

function select(m,pan=true){
  selected=(selected===m&&pan)?null:m; render();
  const v=info(vessels.find(x=>x.mmsi===selected)||{});
  if(selected&&v.lat!=null&&pan){ map.setView([v.lat,v.lon],Math.max(map.getZoom(),9)); markers[selected]?.openPopup(); }
}
function view(m){
  mode=m;
  [["tMap","map"],["tJobs","jobs"],["tFleet","fleet"],["tVuo","vuo"],["tSites","sites"],["tDisc","disc"]].forEach(([b,k])=>$(b).classList.toggle("on",k===m));
  $("map").style.display=m==="map"?"":"none"; $("side").style.display=m==="map"?"":"none";
  ["fleet","vuo","sites","disc","jobs"].forEach(k=>$(k).style.display=k===m?"block":"none");
  try{ localStorage.setItem("vt_tab",m); }catch(e){}
  render(); if(m==="map") setTimeout(()=>map.invalidateSize(),50);
}
$("list").onclick=e=>{const r=e.target.closest("[data-m]"); if(r) select(r.dataset.m);};
$("fleet").onclick=e=>{const r=e.target.closest("[data-f]"); if(r){ selected=null; view("map"); select(r.dataset.f); }};
$("vuo").onclick=e=>{const r=e.target.closest("[data-u]"); if(r){ vuoSel=vuoSel===r.dataset.u?null:r.dataset.u; renderVuo(); if(vuoSel&&$("jl")) $("jl").scrollIntoView({behavior:"smooth"}); }};
$("jobs").onclick=e=>{
  const ov=e.target.closest("[data-ov]"); if(ov){ const m=ov.dataset.ov; vesOpen.add(m); renderJobs(); const el=$("vs_"+m); if(el) el.scrollIntoView({behavior:"smooth"}); return; }
  const r=e.target.closest("[data-j]"); if(r){ const k=r.dataset.j; jobOpen.has(k)?jobOpen.delete(k):jobOpen.add(k); renderJobs(); }};
$("sites").onclick=e=>{const r=e.target.closest("[data-s]"); if(r){ siteSel=siteSel===r.dataset.s?null:r.dataset.s; renderSites(); }};
$("disc").onclick=e=>{const r=e.target.closest("[data-d]"); if(!r) return; const d=(disc.vessels||{})[r.dataset.d]; if(d&&d.lat!=null){ view("map"); if(!map.hasLayer(discLayer)) discLayer.addTo(map); map.setView([d.lat,d.lon],11); }};
$("tJobs").onclick=()=>view("jobs"); $("tMap").onclick=()=>view("map"); $("tFleet").onclick=()=>view("fleet"); $("tVuo").onclick=()=>view("vuo"); $("tSites").onclick=()=>view("sites"); $("tDisc").onclick=()=>view("disc");
$("hours").onchange=render;
$("ctr").onchange=()=>{ selected=null; firstFit=true; render(); };
$("jcsv").onclick=jobsCsv;
$("acsv").onclick=()=>{
  const h=H(), out=[["mmsi","vessel","contractor","type","job","activity","start_utc","end_utc","hours","wind_farm","port","lat","lon","avg_sog_kn","points","hs_avg_m","hs_max_m","wind_avg_ms","wind_max_ms"]];
  for(const v0 of shown()){ const v=info(v0);
    for(const s of activity(v.mmsi,h,v.vtype).segs) out.push([v.mmsi,v.label,v.contractor,v.vtype,v.job,s.state,new Date(s.start).toISOString(),new Date(s.end).toISOString(),
      s.hours.toFixed(2),s.wf||"",s.port||"",s.lat?.toFixed(5)??"",s.lon?.toFixed(5)??"",s.avg_sog?.toFixed(1)??"",s.pts.length,s.hs?.toFixed(2)??"",s.hs_max?.toFixed(2)??"",s.wind?.toFixed(1)??"",s.wind_max?.toFixed(1)??""]); }
  const csv="\ufeff"+out.map(r=>r.map(c=>/[;"\n]/.test(String(c))?`"${String(c).replace(/"/g,'""')}"`:c).join(";")).join("\n");
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));
  a.download=`vessel_activity_${new Date().toISOString().slice(0,10)}.csv`; a.click();
};
try{ const t=localStorage.getItem("vt_tab"); if(t&&$(t)) mode=t; }catch(e){}
load().then(()=>{ if(mode!=="map") view(mode); }); setInterval(load,5*60e3);
</script>
</body>
</html>
